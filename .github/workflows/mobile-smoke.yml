name: Pagla WebGL mobile smoke test
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "tests/**"
      - ".github/workflows/mobile-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-webgl-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout Pagla
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static game server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pagla-http.log 2>&1 &
          sleep 3
          curl -f http://127.0.0.1:8765/
      - name: Open and validate the real WebGL scene
        run: node tests/mobile-smoke.mjs
      - name: Save screenshot and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagla-webgl-smoke-evidence
          path: test-artifacts/
          retention-days: 7
          if-no-files-found: ignore
