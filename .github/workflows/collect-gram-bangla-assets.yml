name: Collect CC0 Gram Bangla 3D models for Drive
on:
  push:
    paths:
      - '.github/workflows/collect-gram-bangla-assets.yml'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download licensed public model packs
        shell: bash
        run: |
          set -e
          python3 -m pip install --quiet requests
          mkdir -p pagla-assets
          git clone -q --depth=1 --filter=blob:none --sparse https://github.com/Hidencod/tge-assets.git /tmp/tge-assets
          cd /tmp/tge-assets
          git sparse-checkout set packs/nature-kit packs/city-kit-roads packs/city-kit-suburban packs/furniture-kit packs/food-kit packs/mini-characters packs/pirate-kit
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import json, os, re, shutil, pathlib, requests, time
          out=pathlib.Path('pagla-assets')
          records=[]
          selectors={
            'nature-kit': 'tree leaf leaves bush plant grass flower rock stone dirt pond water fence bridge log stump path hill mountain tropical palm',
            'city-kit-roads': 'road bridge electricity pole wires street path sidewalk',
            'city-kit-suburban': 'building house garden fence',
            'furniture-kit': 'bed chair table bench cabinet closet lamp sofa shelf kitchen sink bucket',
            'food-kit': 'banana rice barrel bowl corn coconut apple bottle carrot potato fish',
            'mini-characters': 'character-male character-female',
            'pirate-kit': 'boat ship barrel fish pier dock rope cart'
          }
          for pack,terms in selectors.items():
              folder=pathlib.Path('/tmp/tge-assets/packs')/pack
              selected=[]
              for f in sorted(folder.glob('*.glb')):
                  name=f.stem.lower()
                  if any(x in name for x in terms.split()):
                      selected.append(f)
              limit={'nature-kit':80,'city-kit-roads':30,'city-kit-suburban':22,'furniture-kit':22,'food-kit':22,'mini-characters':14,'pirate-kit':18}[pack]
              for f in selected[:limit]:
                  dest=out/'Kenney_CC0'/pack/f.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(f,dest)
                  records.append({'name':f.stem,'file':str(dest.relative_to(out)),'source':'https://github.com/Hidencod/tge-assets','license':'CC0-1.0','kind':'kenney_game_ready_glb'})
          print('CC0 Kenney:',len(records))
          # Photoreal scanned PBR models from Poly Haven; glTF with all external textures.
          desired=['tree','palm','banana','bush','plant','grass','fern','rock','wood','bucket','barrel','pot','basket','stump','log','bamboo']
          try:
              resp=requests.get('https://api.polyhaven.com/assets?t=models',timeout=40,headers={'User-Agent':'PaglaCC0AssetResearch/1.0'})
              resp.raise_for_status()
              allmodels=resp.json()
              matched=[]
              for key,v in allmodels.items():
                  hay=(' '.join([key,v.get('name',''),v.get('description','')]+v.get('tags',[]))).lower()
                  matches=sum(1 for w in desired if re.search(r'\b'+re.escape(w)+r'\b',hay))
                  if matches>0 and v.get('polycount',0)<200000:
                      matched.append((matches, key))
              matched.sort(key=lambda x:(-x[0],x[1]))
              count=0
              for score,asset_id in matched[:45]:
                  if count>=14:break
                  try:
                      files=requests.get('https://api.polyhaven.com/files/'+asset_id,timeout=30,headers={'User-Agent':'PaglaCC0AssetResearch/1.0'}).json()
                      levels=files.get('gltf',{})
                      chosen=levels.get('1k') or levels.get('2k') or next(iter(levels.values()),{})
                      data=chosen.get('gltf',{})
                      if not data.get('url'):continue
                      targets={asset_id+'.gltf':data}
                      targets.update(data.get('include',{}))
                      folder=out/'PolyHaven_CC0'/asset_id
                      total=sum(i.get('size',0) for i in targets.values())
                      if total>22000000:continue
                      complete=True
                      for relative,item in targets.items():
                          rel=pathlib.PurePosixPath(relative)
                          if '..' in rel.parts or rel.is_absolute():raise ValueError('Unsafe relative file')
                          dest=folder/relative
                          dest.parent.mkdir(parents=True,exist_ok=True)
                          r=requests.get(item['url'],timeout=90,headers={'User-Agent':'PaglaCC0AssetResearch/1.0'})
                          r.raise_for_status()
                          dest.write_bytes(r.content)
                      records.append({'name':allmodels[asset_id].get('name',asset_id),'file':str(folder.relative_to(out))+'/'+asset_id+'.gltf','source':'https://polyhaven.com/a/'+asset_id,'license':'CC0-1.0','kind':'polyhaven_pbr_gltf_with_dependencies'})
                      count+=1
                      print('Downloaded PolyHaven:',asset_id)
                  except Exception as ex: print('Skipping',asset_id,str(ex)[:120])
          except Exception as e: print('PolyHaven API unavailable:',str(e)[:200])
          links=[
          {'name':'Bangladeshi Village House','url':'https://sketchfab.com/3d-models/village-house-for-game-f6339e50009b4f0fb1eaffcfdaf3e27f','license':'CC BY (attribution required)','status':'Download separately after site authentication'},
          {'name':'Traditional Bangladeshi Boat','url':'https://sketchfab.com/3d-models/traditional-bangladeshi-boat-45ab977c53aa44c3b9c81052dcf19b57','license':'CC BY (attribution required)','status':'Download separately after site authentication'},
          {'name':'Bangladeshi Rickshaw','url':'https://www.cgtrader.com/free-3d-models/vehicle/bicycle/bangladeshi-rickshaw','license':'Check downloaded model license','status':'Download separately via CGTrader'},
          {'name':'Water Well','url':'https://sketchfab.com/3d-models/water-well-a448626cf62e46018f358ddaeb487e34','license':'Check original license','status':'Download separately after site authentication'}]
          (out/'ASSETS_MANIFEST.json').write_text(json.dumps({'total_downloaded':len(records),'downloaded':records,'separate_site_downloads':links},ensure_ascii=False,indent=2))
          (out/'README.txt').write_text('Pagla Gram Bangla 3D asset collection\n\nActual model files: Kenney CC0 (.glb) and Poly Haven CC0 (.gltf plus dependency textures).\nModels are not verified to resemble Bangladesh and must be curated for realism.\nSketchfab/CGTrader models listed in ASSETS_MANIFEST.json are links only, not downloaded.\nKenney source: https://github.com/Hidencod/tge-assets\nPoly Haven: https://polyhaven.com\nLicense: CC0 1.0 for downloaded items.\n')
          print('Total files:',len(records))
          PY
      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: pagla-gram-bangla-3d-assets
          path: pagla-assets/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7
