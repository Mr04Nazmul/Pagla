name: Japan Kobe 3D Mobile Smoke

on:
  push:
    branches: [main]
    paths:
      - 'japan/**'
      - 'scripts/japan-3d-smoke.cjs'
      - '.github/workflows/japan-3d-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit
      - name: Serve site and test mobile 3D
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > japan-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/japan/ -o /dev/null; then break; fi
            sleep 1
          done
          PAGLA_BROWSER=chromium node scripts/japan-3d-smoke.cjs
      - name: Test iPhone-like WebKit directly
        continue-on-error: true
        run: PAGLA_BROWSER=webkit node scripts/japan-3d-smoke.cjs
      - name: Upload mobile 3D screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kobe-futabacho-mobile-3d
          path: |
            test-artifacts/
            japan-server.log
          if-no-files-found: ignore
          retention-days: 14
