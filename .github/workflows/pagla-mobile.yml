name: Pagla mobile web graphics smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'village-upgrade.js'
      - 'scripts/mobile-smoke.cjs'
      - '.github/workflows/pagla-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install testing dependency
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Start static site and run mobile canvas test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > pagla-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/mobile-smoke.cjs
      - name: Upload visual screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pagla-mobile-render
          path: |
            test-artifacts/
            pagla-server.log
          if-no-files-found: ignore
          retention-days: 14
