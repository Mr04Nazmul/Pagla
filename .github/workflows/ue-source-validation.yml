name: Validate UE5 source files (static checks only)

on:
  push:
    paths:
      - 'Unreal/**'
      - '.github/workflows/ue-source-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate project descriptor JSON
        run: python -m json.tool Unreal/GramBangla/GramBangla.uproject > /dev/null
      - name: Validate Python editor tool syntax
        run: python -m py_compile Unreal/GramBangla/Content/Python/build_village.py
      - name: Check basic project structure
        run: |
          test -s Unreal/GramBangla/Source/GramBangla/GramBanglaCharacter.cpp
          test -s Unreal/GramBangla/Source/GramBangla/GramBanglaGameMode.cpp
          test -s Unreal/GramBangla/Config/DefaultEngine.ini
          test -s Unreal/GramBangla/README.md
      - name: Note actual UE5 verification still required
        run: echo "This CI only checks text/project structure. UE5 Editor build and play tests require Unreal Engine and a supported host."
